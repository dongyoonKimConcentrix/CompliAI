version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: compliai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-compliai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=10
      -c work_mem=2MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-compliai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 200M

  api:
    build: ./api
    image: dongyoonkimconcentrix/compliai-api:latest
    container_name: compliai_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-compliai_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 200M

  web:
    build: ./web
    image: dongyoonkimconcentrix/compliai-web:latest
    container_name: compliai_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - FASTAPI_INTERNAL_URL=http://api:8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-compliai_db}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - CRON_SECRET=${CRON_SECRET}
    ports:
      - "80:3000"
    volumes:
      - uploads_data:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 250M

volumes:
  postgres_data:
  uploads_data:
